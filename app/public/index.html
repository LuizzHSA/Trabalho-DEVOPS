<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevOps App - Render</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 48px 40px;
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .badge {
      display: inline-block;
      background: #22c55e;
      color: #052e16;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 24px;
      letter-spacing: 0.5px;
    }
    h1 {
      font-size: 28px;
      margin-bottom: 12px;
      color: #f8fafc;
    }
    p {
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 8px;
    }
    .info {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid #334155;
      font-size: 14px;
      color: #64748b;
    }
    .info strong { color: #94a3b8; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">ONLINE</div>
    <h1>DevOps App</h1>
    <p>Aplicativo rodando em <strong>Render</strong> (Free Tier)</p>
    <p>Deploy automático a cada push no GitHub</p>
    <div class="info">
      <p><strong>Trabalho:</strong> Da pesquisa à entrega automática</p>
      <p><strong>Repositório:</strong> LuizzHSA/Trabalho-DEVOPS</p>
      <p><strong>URL:</strong> devops-app-x1r7.onrender.com</p>
    </div>
  </div>
</body>
</html>
